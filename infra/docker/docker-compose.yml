# Local development services: MongoDB 8 (single-node replica set, needed for transactions),
# Redis 7 and Mailpit (catches e-mail). Start with: docker compose -f infra/docker/docker-compose.yml up -d
services:
  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']
volumes:
  mongo-data:
